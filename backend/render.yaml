services:
  - type: web
    name: vectorshift-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://vector-shift-kab3.vercel.app,http://localhost:3000

